<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель лабораторных работ — ПР №3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Панель лабораторных работ</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="#dashboard">Показатели</a></li>
        <li class="nav-item"><a class="nav-link" href="#actions">Действия</a></li>
        <li class="nav-item"><a class="nav-link" href="#schedule">Расписание</a></li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <img src="assets/avatar.svg" alt="Аватар пользователя"
              class="rounded-circle border border-2 border-light"
              width="36" height="36" id="userAvatar">
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">

  <section id="dashboard" class="mb-4">
    <h2 class="h4 mb-3">Показатели</h2>
    <div class="row g-3" id="cardsRow"></div>
  </section>

  <section id="actions" class="mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Последние действия</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
        Добавить запись
      </button>
    </div>
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Событие</th>
            <th scope="col">Статус</th>
          </tr>
        </thead>
        <tbody id="actionsBody"></tbody>
      </table>
    </div>
  </section>

  <section id="schedule" class="mb-4">
    <h2 class="h4 mb-3">Расписание</h2>
    <div class="accordion" id="scheduleAccordion">
      <div class="accordion-item">
        <h3 class="accordion-header">
          <button class="accordion-button" type="button"
                  data-bs-toggle="collapse" data-bs-target="#sched1"
                  aria-expanded="true" aria-controls="sched1">
            Ближайшие задачи
          </button>
        </h3>
        <div id="sched1" class="accordion-collapse collapse show"
             data-bs-parent="#scheduleAccordion">
          <div class="accordion-body" id="scheduleBody">
            <p>Проверка лабораторных работ и подготовка отчётов.</p>
            <img src="assets/chart.svg" alt="График выполнения лабораторных работ"
                class="img-fluid rounded border" id="scheduleChart">
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- Modal -->
<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Новая запись</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="recordEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="recordEmail"
                   required placeholder="user@example.com">
            <div class="invalid-feedback">Введите корректный email.</div>
          </div>
          <div class="mb-3">
            <label for="recordTitle" class="form-label">Название</label>
            <input type="text" class="form-control" id="recordTitle"
                   required minlength="3" placeholder="Например, Лабораторная №5">
            <div class="invalid-feedback">Минимум 3 символа.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-success" id="saveButton">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="saveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Уведомление</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Закрыть"></button>
    </div>
    <div class="toast-body" id="toastBody">Запись сохранена.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
